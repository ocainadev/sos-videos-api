version: "3.9"

networks:
  sosvideos-net:
    driver: bridge

services:

  # ── Banco de dados ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${DB_NAME}
      POSTGRES_USER:     ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - sosvideos-net
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 512m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend Spring Boot ───────────────────────────────────────────────────────
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL:      jdbc:postgresql://postgres:5432/${DB_NAME}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}

      JWT_SECRET:        ${JWT_SECRET}
      JWT_EXPIRATION:    ${JWT_EXPIRATION}

      # Google Drive
      G_CREDENTIALS: /app/credentials.json
      G_TOKEN:       /app/tokens

      # Admin seed
      ADMIN_E: ${ADMIN_E}
      ADMIN_P: ${ADMIN_P}

      # Kiwify
      KIWIFY_WEBHOOK_SECRET: ${KIWIFY_WEBHOOK_SECRET}

      # CORS
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS}

      # Swagger fechado em produção
      APP_SWAGGER_PUBLIC: "false"
    volumes:
      - ./credentials.json:/app/credentials.json:ro
      - google_tokens:/app/tokens
    networks:
      - sosvideos-net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    deploy:
      resources:
        limits:
          memory: 1200m
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ── Frontend Nginx ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../sosvideos-frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - sosvideos-net
    ports:
      - "127.0.0.1:8081:80"
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          memory: 128m

volumes:
  postgres_data:
  google_tokens:

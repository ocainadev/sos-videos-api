# /etc/nginx/sites-available/sosvideos
#
# Nginx instalado na VPS — roteia domínios para os containers.
# Para cada novo projeto: crie um novo bloco server apontando para outra porta.
#
# Ativar:
#   sudo ln -s /etc/nginx/sites-available/sosvideos /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name sosvideos.com www.sosvideos.com;

    # Redireciona todo HTTP para HTTPS (após configurar o Certbot)
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name sosvideos.com www.sosvideos.com;

    # Certificado gerado pelo Certbot (Let's Encrypt — gratuito)
    # sudo certbot --nginx -d sosvideos.com -d www.sosvideos.com
    ssl_certificate     /etc/letsencrypt/live/sosvideos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/sosvideos.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Downloads de vídeo — timeout maior para arquivos grandes
    location ~* ^/api/videos/[^/]+/download {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
        proxy_buffering    off;
    }

    # Passa tudo para o container frontend (porta 8081 do host)
    location / {
        proxy_pass         http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}


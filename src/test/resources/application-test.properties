# Banco de testes local (PostgreSQL)
spring.datasource.url=jdbc:postgresql://localhost:5432/sosvideos_test
spring.datasource.username=ocainasantos
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# Schema recriado a cada execucao; Flyway desabilitado nos testes
spring.jpa.hibernate.ddl-auto=create-drop
spring.flyway.enabled=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT — Base64 valido (32 bytes de 's' = 256 bits)
app.jwt.secret=c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M=
app.jwt.expiration-ms=3600000

# Google Drive — bean @Lazy, nao sera inicializado nos testes
app.google.drive.credentials-path=fake.json
app.google.drive.application-name=SOS Videos Test
app.google.drive.tokens-directory-path=/tmp/test-tokens

# Admin seed
app.admin.email=admin@sostest.com
app.admin.password=TestAdmin@123

# Kiwify
app.kiwify.webhook-secret=test-webhook-secret

# CORS
app.cors-allowed-origins=http://localhost:3000

# Swagger — publico apenas em dev/test; em producao manter false (requer autenticacao)
app.swagger.public=true

# Reducao de logs durante os testes
logging.level.com.sosvideos=WARN
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=WARN
logging.level.org.hibernate.SQL=WARN

spring.application.name=sosvideos
server.port=8080

# --- Tomcat thread pool -------------------------------------------------------
# Downloads são I/O-bound (stream do Drive), então 1 thread aguenta bem com pouco CPU
# KVM 1 (1 core, 4GB): 150 threads × ~1MB stack = ~150MB reservado
server.tomcat.threads.max=150
server.tomcat.threads.min-spare=10
# Fila de conexões aguardando thread livre (evita rejeição imediata no pico)
server.tomcat.accept-count=100
server.tomcat.connection-timeout=20000
# Máximo de conexões simultâneas abertas (inclui as na fila)
server.tomcat.max-connections=2000

# --- DataSource / HikariCP ----------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# Downloads não seguram conexão DB (só auth + INSERT rápido), 20 é suficiente para 500 usuários
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=900000
spring.datasource.hikari.keepalive-time=60000
spring.datasource.hikari.leak-detection-threshold=60000

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=America/Sao_Paulo

# --- Flyway -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- JWT ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

# --- Google Drive -------------------------------------------------------------
app.google.drive.credentials-path=${G_CREDENTIALS}
app.google.drive.application-name=SOS Videos
app.google.drive.tokens-directory-path=${G_TOKEN}

# --- Admin seed ---------------------------------------------------------------
app.admin.email=${ADMIN_E}
app.admin.password=${ADMIN_P}

# --- Kiwify webhook -----------------------------------------------------------
app.kiwify.webhook-secret=${KIWIFY_WEBHOOK_SECRET}

# --- CORS ---------------------------------------------------------------------
app.cors-allowed-origins=${CORS_ALLOWED:http://localhost:5500,http://127.0.0.1:5500}

# --- Logging ------------------------------------------------------------------
logging.level.com.sosvideos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- MVC Async ----------------------------------------------------------------
# Desabilita o timeout padrão de 30s para respostas assíncronas.
# Com redirect para o Drive não é mais necessário, mas protege o fallback de
# streaming (proxy) para arquivos grandes em conexões lentas.
spring.mvc.async.request-timeout=-1

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Swagger ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Jackson ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=America/Sao_Paulo

spring.application.name=sosvideos
server.port=8080

# --- DataSource ---------------------------------------------------------------
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=30000

# --- JPA / Hibernate ----------------------------------------------------------
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway -------------------------------------------------------------------
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true

# --- JWT ----------------------------------------------------------------------
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-ms=${JWT_EXPIRATION}

# --- Google Drive -------------------------------------------------------------
app.google.drive.credentials-path=${G_CREDENTIALS}
app.google.drive.application-name=SOS Videos
app.google.drive.tokens-directory-path=${G_TOKEN}

# --- Admin seed ---------------------------------------------------------------
app.admin.email=${ADMIN_E}
app.admin.password=${ADMIN_P}

# --- Kiwify webhook -----------------------------------------------------------
app.kiwify.webhook-secret=${KIWIFY_WEBHOOK_SECRET}

# --- CORS ---------------------------------------------------------------------
app.cors-allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# --- Logging ------------------------------------------------------------------
logging.level.com.sosvideos=INFO
logging.level.org.springframework.security=WARN
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# --- Actuator -----------------------------------------------------------------
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# --- Swagger ------------------------------------------------------------------
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method

# --- Jackson ------------------------------------------------------------------
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.time-zone=UTC
